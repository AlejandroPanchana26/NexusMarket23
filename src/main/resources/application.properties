spring.application.name=NexusMarket

# Puerto de la aplicación.
server.port=${SERVER_PORT:8080}

# MySQL: datos del negocio. Por defecto apunta al MySQL de Docker publicado en el PC (localhost:3307);
# dentro de Docker Compose se usa la variable DB_URL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/nexusmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:nexus_app}
spring.datasource.password=${DB_PASSWORD:nexus_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea y actualiza las tablas automáticamente a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# MongoDB: historial de movimientos de inventario.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket_history}
